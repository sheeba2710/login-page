<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #0d0d0d;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .contact-container {
            width: 100%;
            max-width: 1100px;
            background: #151515;
            border: 1px solid #222;
            border-radius: 24px;
            padding: 50px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 42px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .header p {
            color: #a0a0a0;
            font-size: 15px;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 50px;
        }

        .info-box h2 {
            font-size: 24px;
            margin-bottom: 25px;
        }

        .info-item {
            margin-bottom: 20px;
            padding: 18px;
            background: #1c1c1c;
            border-radius: 12px;
            transition: 0.3s ease;
        }

        .info-item:hover {
            transform: translateY(-3px);
            background: #242424;
        }

        .info-item p {
            color: #d0d0d0;
            font-size: 15px;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .contact-form input,
        .contact-form textarea {
            width: 100%;
            padding: 16px;
            background: #1c1c1c;
            border: 1px solid #2c2c2c;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .contact-form input:focus,
        .contact-form textarea:focus {
            border-color: #4f7cff;
        }

        .contact-form textarea {
            min-height: 140px;
            resize: none;
        }

        .contact-form button {
            padding: 16px;
            background: white;
            color: black;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .contact-form button:hover {
            background: #4f7cff;
            color: white;
        }

        @media(max-width: 850px) {
            .contact-grid {
                grid-template-columns: 1fr;
            }

            .contact-container {
                padding: 30px;
            }

            .header h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <div class="contact-container">

        <div class="header">
            <h1>Contact Us</h1>
            <p>Have a question or feedback? We'd love to hear from you.</p>
        </div>

        <div class="contact-grid">

            <div class="info-box">

                <h2>Get In Touch</h2>

                <div class="info-item">
                    <p>📍 Tuticorin, Tamil Nadu, India</p>
                </div>

                <div class="info-item">
                    <p>📞 +91 98765 43210</p>
                </div>

                <div class="info-item">
                    <p>✉ support@pulsemart.com</p>
                </div>

                <div class="info-item">
                    <p>🕒 Mon - Sat | 9:00 AM - 6:00 PM</p>
                </div>

            </div>

            <form class="contact-form">

                <input type="text" placeholder="Your Name">

                <input type="email" placeholder="Your Email">

                <input type="text" placeholder="Subject">

                <textarea placeholder="Write your message..."></textarea>

                <button type="submit">Send Message</button>

            </form>

        </div>

    </div>

</body>

</html>
